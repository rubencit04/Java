<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página con Bloque para Juego</title>
  <style>
    body {
      margin: 20px;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ff7675; /* Tono de rojo menos intenso */
      color: white; /* Color del texto para que sea legible sobre el fondo rojo */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* Oculta la barra de desplazamiento vertical */
    }

    #juegoContainer {
      background-color: #3498db; /* Color para el bloque del juego */
      padding: 400px; /* Ajusta el tamaño del bloque */
      border-radius: 10px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden; /* Para que las nubes no sobresalgan del contenedor */
    }

    #sueloVerde {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20px;
      background-color: #2ecc71; /* Color verde para el suelo */
      border-bottom: 5px solid #27ae60; /* Borde en la parte inferior del suelo */
    }

    #nivelSelector {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .nivelButton {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2ecc71; /* Color para los botones de nivel */
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      text-decoration: none; /* Quita la línea subrayada */
      transition: background-color 0.3s;
    }

    .nivelButton:hover {
      background-color: #27ae60; /* Cambia el color al pasar el ratón sobre el botón */
    }

    /* Estilo para las nubes */
    .nube {
      position: absolute;
      border-radius: 50%;
      background-color: white;
      opacity: 0.7;
      transform-origin: 50% 50%;
      animation: moverNube linear infinite;
    }

    .nube1 {
      width: 120px;
      height: 60px;
      top: 50px;
      left: 100px;
      animation-duration: 20s;
    }

    .nube2 {
      width: 150px;
      height: 80px;
      top: 150px;
      left: 300px;
      animation-duration: 15s;
    }

    .nube3 {
      width: 100px;
      height: 50px;
      top: 250px;
      left: 500px;
      animation-duration: 25s;
    }

    @keyframes moverNube {
      0% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(20px);
      }
      100% {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

<div id="juegoContainer">
  <!-- Agrega el contenido y los elementos del juego aquí -->
  <h1>¡Prepárate para la acción!</h1>

  <div class="nube nube1"></div>
  <div class="nube nube2"></div>
  <div class="nube nube3"></div>

  <div id="sueloVerde"></div>

  <div id="nivelSelector">
    <a class="nivelButton" href="Nivel1.html">Nivel 1</a>
    <a class="nivelButton" href="ivel2.html">Nivel 2</a>
  </div>
</div>
</body>
</html>
