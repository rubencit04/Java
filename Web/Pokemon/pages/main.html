<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Pokemon Card Checker</title>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="pokemon">
                <img src="../asset/images/logo.svg" class="logo">
                <h1>Pokemon Card</h1>
            </div>
            <div class="sidebar-elementos">
                <p class="inicio">Inicio</p>
                <p>Interesado en comprar</p>
                <p>Configuración<p>
            </div>   
        </div>

        <div class="main-content">
            <div class="header">
                <h2>Colección (32/102)</h2>
                <div class="busqueda">
                    <input type="text" placeholder="Buscar cartas">
                    <div class="lupita">
                        <img src="../asset/icons/search-white-18dp 1.svg">
                    </div>
                    
                </div>
                <div class="lista">
                    <img src="../asset/icons/bi_list.svg">
                    <p>Lista</p>
                </div>
                <div class="cuadricula">
                    <img src="../asset/icons/ion_grid.svg">
                    <p>Cuadricula</p>
                </div>
            </div>
            <div class="cartas">
                
            </div>
        </div>
    </div>
</body>
</html>
