<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <div class="box">
            <h2>Shakes</h2>
            <p>REJECTING</p>
            <button class="shake">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Pulse</h2>
            <p>PARTYING</p>
            <button class="pulse">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Glitch</h2>
            <p>HACKING</p>
            <button class="glitch">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Turn</h2>
            <p>FLIPPING</p>
            <button class="turn">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Fill</h2>
            <p>LOADING</p>
            <button class="fill">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Sheen</h2>
            <p>SHINING</p>
            <button class="sheen">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Emphasize</h2>
            <p>GLOWING</p>
            <button class="emphasize">CLICK ME</button>
        </div>
        <div class="box">
            <h2>Blur</h2>
            <p>CENSORING</p>
            <button class="blur">CLICK ME</button>
        </div>
        <div class="box">
            <h2>TonyHawk</h2>
            <p>FLIPPING</p>
            <button class="tony-hawk">CLICK ME</button>
        </div>
    </div>
</body>
</html>
