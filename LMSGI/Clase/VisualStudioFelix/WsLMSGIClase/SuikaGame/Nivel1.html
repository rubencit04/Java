<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 1</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #ff7675;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }


    #contenedorPrincipal {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
    }



    #juegoContainer {
      top: 5vh;
      width: 80vw;
      height: 80vh;
      position: relative;
      border-radius: 10px;
      text-align: center;
      overflow: hidden;
      cursor: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: linear-gradient(to bottom, #3498db, #ff7675);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);

    }

    #sueloVerde {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 20px;
      background-color: #2ecc71;
      border-bottom: 5px solid #27ae60;
    }

    @keyframes caidaSenora {
      to {
        transform: translateY(100vh);
      }
    }

    #puntuacion {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 24px;
      color: white;
    }

    #mensaje-perdida,
    #mensaje-pausa {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #d35400;
      padding: 20px;
      color: white;
      font-size: 24px;
      display: none;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    #reiniciar-info {
      margin-top: 10px;
    }

    #reiniciar-btn,
    a {
      margin-top: 10px;
      padding: 10px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      cursor: pointer;
      display: inline-block;
      transition: background-color 0.3s ease;
    }

    #reiniciar-btn:hover,
    a:hover {
      background-color: #2980b9;
    }

    #cieloSuelo {
  transition: background 0.5s ease;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, #3498db, #ff7675);
  /* Gradiente para el cielo y el suelo */
}

    #reiniciar-btn {
      margin-top: 10px;
      padding: 10px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      /* Quitar subrayado del enlace */
      border-radius: 5px;
      cursor: pointer;
      display: block;
    }

    .moneda-suelo {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background-image: url('id.png');
      /* Reemplaza con la ruta correcta de tu imagen */
      background-size: cover;
      border-radius: 50%;
      animation: moverLadoALado 2s linear infinite;
      /* Nueva animación de lado a lado */
    }


    @keyframes moverLadoALado {
      0% {
        transform: translateX(-50%) rotateY(0deg);
      }

      50% {
        transform: translateX(-50%) rotateY(180deg);
      }

      100% {
        transform: translateX(-50%) rotateY(360deg);
      }
    }

    .senora {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 125px;
      /* Color para las señoras */
      border-radius: 50%;
      background-image: url(https://cdn-icons-png.flaticon.com/128/782/782605.png);
      background-position: center;

      animation: caidaSenora linear infinite;
    }

    #mensaje-pausa p {
      margin: 10px 0;
    }

    #persona {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: caminar 0.6s infinite alternate;
      /* Nueva regla para la animación de caminar */
    }

    @keyframes caminar {
      0% {
        transform: translateX(-50%) scaleY(1);
      }

      100% {
        transform: translateX(-50%) scaleY(0.95);
      }
    }

    /* Agrega estas reglas para animar las piernas durante la caminata */
    #piernas {
      display: flex;
      animation: piernas 0.6s infinite alternate;
    }

    @keyframes piernas {
      0% {
        transform: translateY(0);
      }

      100% {
        transform: translateY(5px);
      }
    }

    #cabeza-con-casco {
      position: relative;
    }

    #cabeza {
      width: 40px;
      height: 40px;
      background-color: #f39c12;
      border-radius: 50%;
      margin-bottom: 5px;
    }

    #casco {
      position: absolute;
      top: -25px;
      left: -15px;
      width: 70px;
      /* Ajusta según el tamaño de tu casco */
      height: 69px;
      /* Ajusta según el tamaño de tu casco */
      background-image: url('militar.png');
      /* Ruta de la imagen del casco */
      background-size: cover;
      background-position: left;
      border-radius: 50%;
    }

    #metralleta {
      position: absolute;
      background-size: cover;
      width: 200px;
      height: 200px;
      right: 50px;
      bottom: 25px;
      background-image: url(robot.png);
    }

    /* Estilo para las nubes */
    .nube {
      position: absolute;
      border-radius: 50%;
      background-color: white;
      opacity: 0.7;
      transform-origin: 50% 50%;
      animation: moverNube linear infinite;
    }

    .nube1 {
      width: 120px;
      height: 60px;
      top: 50px;
      left: 100px;
      animation-duration: 20s;
    }

    .nube2 {
      width: 150px;
      height: 80px;
      top: 150px;
      left: 300px;
      animation-duration: 15s;
    }

    .nube3 {
      width: 100px;
      height: 50px;
      top: 250px;
      left: 500px;
      animation-duration: 25s;
    }

    @keyframes moverNube {
      0% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(20px);
      }

      100% {
        transform: translateX(0);
      }
    }

    #cuerpo {
      width: 30px;
      height: 50px;
      background-color: #f39c12;
      background-image: url(patron-costuras-militar-ilustracion_272897-100.avif);
      background-size: cover;
    }

    #piernas {
      display: flex;
    }

    #bandera {
      background-image: url(spain.png);
      position: relative;
      background-size: cover;
      height: 15px;
      left: 6px;
      width: 15px;
      bottom: -60px;

    }

    .pierna {
      width: 10px;
      height: 30px;
      background-color: #f39c12;
      margin: 0 5px;
      background-image: url(patron-costuras-militar-ilustracion_272897-100.avif);
      background-size: cover;
    }

    /* Agrega la animación de salida volando */
    @keyframes salidaVolando {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-200%) rotate(720deg);
        opacity: 0;
      }
    }

    /* Aplica la animación a la clase 'golpeado' */
    .golpeado #cabeza,
    .golpeado #cuerpo,
    .golpeado .pierna {
      animation: salidaVolando 1s ease-out forwards;
    }

    #reloj {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 18px;
      color: white;
    }

    #otrasContenedor {
      width: 60px;
      /* Ajusta el ancho según tus necesidades */
      height: 120px;
      background-color: #2d858dcd;
      /* Color de fondo */
      margin-top: 40px;
      /* Espacio entre el contenedor del juego y "Otras" */
      border-radius: 10px;
      /* Bordes redondeados */
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      /* Sombra ligera */

    }

    #contenedorranking {
      width: 60px;
      height: 60px;
      border-radius: 10px;
    }

    #luna,
    #sol {
      position: absolute;
      left: 580px;
      border-radius: 50%;
      width: 80px;
      /* Ajusta según tus preferencias */
      height: 80px;
      /* Ajusta según tus preferencias */
      background-color: #f1c40f;
      /* Color amarillo para el sol, puedes cambiarlo */
      box-shadow: 0 0 30px rgba(241, 196, 15, 0.8);
      /* Sombra suave alrededor del sol */
      transition: opacity 0.5s ease-in-out, bottom 0.5s ease-in-out, transform 0.5s ease-in-out;
      /* Transición suave de opacidad, posición y transformación */
    }

    #luna {
      background-color: #ecf0f1;
      /* Color grisáceo para la luna, puedes cambiarlo */
      box-shadow: 0 0 30px rgba(236, 240, 241, 0.8);
      /* Sombra suave alrededor de la luna */
      opacity: 0;
      /* Comienza invisible */
    }

    #militarfondo {
      background-image: url(militarfondo.png);
      position: absolute;
      background-size: cover;
      width: 150px;
      height: 150px;
      left: 50px;
      bottom: 20px;
    }
    #basemilitar,
    #basemilitar1,#basemilitar2{
      background-image: url(militar-base.png);
      position: absolute;
      background-size: cover;
      width: 300px;
      height: 300px;
      left: 420px;
      bottom: -5px;
    }
    #basemilitar1{
      left: 620px;
    }
    #basemilitar2{
      left: 820px;
    }

    
  </style>
</head>

<body>
  <div id="contenedorPrincipal">
    <div id="juegoContainer">
      <div id="cieloSuelo">
        <div id="militarfondo"></div>
        <div id="reloj">13:00</div>
        <div id="sol"></div>
        <div id="luna"></div>
        <div id="metralleta"></div>
        <div id="basemilitar"></div>
        <div id="basemilitar1"></div>
        <div id="basemilitar2"></div>
        <div class="nube nube1"></div>
        <div class="nube nube2"></div>
        <div class="nube nube3"></div>
        <div id="puntuacion">Puntuación: 0</div>
        <!-- En tu archivo HTML, reemplaza la definición del personaje con el siguiente código -->
        <div id="persona">
          <div id="bandera"></div>
          <div id="cabeza-con-casco">
            <div id="cabeza"></div>
            <!-- La imagen del casco se establece como fondo -->
            <div id="casco"></div>
          </div>
          <div id="cuerpo"></div>
          <div id="piernas">
            <div class="pierna"></div>
            <div class="pierna"></div>
          </div>
        </div>
        <div class="senora"></div>
        <div class="senora"></div>
        <div class="senora"></div>
        <div id="mensaje-perdida">¡Has perdido!<br>Puntuación: <span id="puntuacion-final"></span>
          <p id="reiniciar-info">Para reiniciar nivel, pulsa la tecla R.</p>
          <a id="reiniciar-btn" href="web.html">Cambiar de Nivel</a>
        </div>
        <div id="mensaje-pausa">
          <p>Juego pausado</p>
          <p>Presiona P nuevamente para reanudar</p>
        </div>
        <div id="sueloVerde"></div>
      </div>
    </div>
    <div id="otrasContenedor">
      <div id="contenedorranking">
        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828884.png" width="60" />
      </div>
    </div>
    <script>
      // Obtener puntuaciones desde el almacenamiento local o inicializar si no existen
      let juegoActivo = true;
      document.addEventListener('DOMContentLoaded', function () {
        let hora = 13;
        let minutos = 0;
        let scores = JSON.parse(localStorage.getItem('scores')) || [];
        let puntuacion = 0;
        let generandoMoneda = true;
        let cantidadSenoras = 2;
        let maxSenoras = 12;
        let intervaloSenoras;
        let intervaloMonedas;
        let nombreJugador = '';
        let cicloDia = true;
        let transicion = 0;

        function actualizarReloj() {
          minutos += 15;
          if (minutos >= 60) {
            minutos = 0;
            hora = (hora + 1) % 24;
          }

          const reloj = document.getElementById('reloj');
          const horaFormateada = String(hora).padStart(2, '0');
          const minutosFormateados = String(minutos).padStart(2, '0');
          reloj.textContent = `${horaFormateada}:${minutosFormateados}`;

          cambiarCicloDiaNoche(hora);
        }

        function cambiarCicloDiaNoche(hora) {
          const cieloSuelo = document.getElementById('cieloSuelo');
          const esManana = (hora >= 6 && hora < 13);
          const esTarde = (hora >= 13 && hora < 19);
          const esNoche = (hora >= 19 && hora < 24) || (hora >= 0 && hora < 6);

          // Ajustar la velocidad del cambio según tus preferencias
          const velocidadCambio = 0.01; // Puedes ajustar este valor

          if (esManana) {
            transicion = Math.min(transicion + velocidadCambio, 1);
          } else if (esTarde) {
            transicion = 1; // Tarde, sin transición
          } else {
            transicion = Math.max(transicion - velocidadCambio, 0);
          }

          aplicarColor(transicion, esManana ? 'manana' : (esTarde ? 'tarde' : 'noche'), cieloSuelo);
          const sol = document.getElementById('sol');
          const luna = document.getElementById('luna');

          if (esManana) {
            sol.style.opacity = 1;
            luna.style.opacity = 0;
            sol.style.bottom = '50%';
            luna.style.bottom = '100%';
          } else if (esTarde) {
            sol.style.opacity = 1;
            luna.style.opacity = 0;
            sol.style.bottom = '50%';
            luna.style.bottom = '100%';
          } else {
            sol.style.opacity = 0;
            luna.style.opacity = 1;
            sol.style.bottom = '100%';
            luna.style.bottom = '50%';
          }
        }


        function aplicarColor(transicion, momento, elemento) {
          const colorManana = '#3498db';
          const colorTarde = '#e74c3c';
          const colorNoche = '#2c3e50';

          let colorCieloSuelo;
          if (momento === 'manana') {
            colorCieloSuelo = interpolarColor(colorNoche, colorManana, transicion);
          } else if (momento === 'tarde') {
            colorCieloSuelo = colorTarde;
          } else {
            colorCieloSuelo = interpolarColor(colorManana, colorNoche, transicion);
          }

          elemento.style.background = colorCieloSuelo;
        }

        function interpolarColor(colorInicio, colorFin, transicion) {
          const rInicio = parseInt(colorInicio.substring(1, 3), 16);
          const gInicio = parseInt(colorInicio.substring(3, 5), 16);
          const bInicio = parseInt(colorInicio.substring(5, 7), 16);

          const rFin = parseInt(colorFin.substring(1, 3), 16);
          const gFin = parseInt(colorFin.substring(3, 5), 16);
          const bFin = parseInt(colorFin.substring(5, 7), 16);

          const rInterpolado = Math.round(rInicio + (rFin - rInicio) * transicion);
          const gInterpolado = Math.round(gInicio + (gFin - gInicio) * transicion);
          const bInterpolado = Math.round(bInicio + (bFin - bInicio) * transicion);

          return `rgb(${rInterpolado}, ${gInterpolado}, ${bInterpolado})`;
        }


        function iniciarCicloDiaNoche() {
          setInterval(actualizarReloj, 1000);
          setInterval(() => {
            cicloDia = !cicloDia;
            transicion = cicloDia ? 0 : 1;
          }, 120000);
        }

        iniciarCicloDiaNoche();



        function actualizarRanking() {
          // Ordenar puntuaciones de mayor a menor
          scores.sort((a, b) => b.score - a.score);

          // Mostrar las primeras 5 puntuaciones en el ranking
          console.log('Ranking:');
          for (let i = 0; i < Math.min(scores.length, 5); i++) {
            console.log(`${i + 1}. ${scores[i].name}: ${scores[i].score}`);
          }
        }

        function agregarPuntuacionAlRanking(nombre, puntuacion) {
          scores.push({ name: nombre, score: puntuacion });

          // Guardar puntuaciones en el almacenamiento local
          localStorage.setItem('scores', JSON.stringify(scores));

          // Actualizar el ranking después de agregar una nueva puntuación
          actualizarRanking();
        }

        function actualizarPuntuacion() {
          document.getElementById('puntuacion').textContent = 'Puntuación: ' + puntuacion;
        }
        function verificarColision() {
          if (!juegoActivo) return;

          const persona = document.getElementById('persona');
          const rectPersona = persona.getBoundingClientRect();

          // Verificar colisión con señoras
          const senoras = document.querySelectorAll('.senora');
          senoras.forEach((senora) => {
            const rectSenora = senora.getBoundingClientRect();

            if (
              rectPersona.left < rectSenora.right &&
              rectPersona.right > rectSenora.left &&
              rectPersona.top < rectSenora.bottom &&
              rectPersona.bottom > rectSenora.top
            ) {
              // Colisión con señora detectada, juego perdido
              juegoPerdido();

              // Agregar la clase 'golpeado' al personaje
              persona.classList.add('golpeado');
            }
          });

          // Verificar colisión con moneda
          const moneda = document.querySelector('.moneda-suelo');
          if (moneda) {
            const rectMoneda = moneda.getBoundingClientRect();

            if (
              rectPersona.left < rectMoneda.right &&
              rectPersona.right > rectMoneda.left &&
              rectPersona.top < rectMoneda.bottom &&
              rectPersona.bottom > rectMoneda.top
            ) {
              // Colisión con moneda detectada, incrementar puntuación y quitar la moneda
              puntuacion += 10;
              actualizarPuntuacion();
              document.getElementById('juegoContainer').removeChild(moneda);

              // Permitir la generación de una nueva moneda
              generandoMoneda = true;

              // Aumentar la cantidad de señoras cada vez que se suman 50 puntos
              if (puntuacion % 50 === 0 && cantidadSenoras < maxSenoras) {
                cantidadSenoras++;
              }

              // Aumentar la velocidad de las señoras cada vez que se suman 10 puntos
              if (puntuacion % 10 === 0) {
                aumentarVelocidadSenoras();
              }

              // Generar más señoras cada vez que se suman 50 puntos
              if (puntuacion % 50 === 0) {
                generarSenorasAleatorias();
              }
            }
          }
        }

        function juegoPerdido() {
          juegoActivo = false;
          generandoMoneda = false;

          // Mostrar mensaje de pérdida y puntuación final
          const mensajePerdida = document.getElementById('mensaje-perdida');
          const puntuacionFinal = document.getElementById('puntuacion-final');
          puntuacionFinal.textContent = puntuacion;
          mensajePerdida.style.display = 'block';

          // Ocultar el casco al agregar la clase 'golpeado'
          const casco = document.getElementById('casco');
          casco.style.display = 'none';
          const bandera = document.getElementById('bandera');
          bandera.style.display = 'none';
          // Obtener el elemento persona (personaje) y aplicar la clase 'golpeado'
          const persona = document.getElementById('persona');
          persona.classList.add('golpeado');

          // Detener intervalos existentes
          clearInterval(intervaloSenoras);
          clearInterval(intervaloMonedas);
        }



        document.addEventListener('keydown', function (event) {
          if (!juegoActivo) {
            if (event.key === 'r') {
              reiniciarNivel();
            } else if (event.key === 'p' || event.key === 'P') {
              pausarJuego();
            }
            return;
          }

          const persona = document.getElementById('persona');
          const posicionPersona = persona.offsetLeft;

          if (event.key === 'ArrowLeft' || event.key === 'a') {
            if (posicionPersona > 0) {
              persona.style.left = posicionPersona - 10 + 'px';
              verificarColision();
            }
          } else if (event.key === 'ArrowRight' || event.key === 'd') {
            if (posicionPersona + persona.offsetWidth < document.getElementById('juegoContainer').offsetWidth) {
              persona.style.left = posicionPersona + 10 + 'px';
              verificarColision();
            }
          } else if (event.key === 'p' || event.key === 'P') {
            // Pausar juego al presionar la tecla P
            pausarJuego();
          }
        });

        function generarSenora() {
          if (!juegoActivo) return;

          const senora = document.createElement('div');
          senora.className = 'senora';
          const randomLeft = Math.random() * (document.getElementById('juegoContainer').offsetWidth - 50);
          senora.style.left = randomLeft + 'px';
          document.getElementById('juegoContainer').appendChild(senora);

          senora.animate(
            [
              { transform: 'translateY(0)' },
              { transform: 'translateY(100vh)' }
            ],
            {
              duration: 3000,
              easing: 'linear',
              fill: 'forwards'
            }
          );

          setTimeout(() => {
            if (juegoActivo) {
              document.getElementById('juegoContainer').removeChild(senora);
            }
          }, 3000);
        }

        function generarSenoras() {
          const maximoSenoras = 10; // Cambia este valor al máximo deseado

          for (let i = 0; i < cantidadSenoras; i++) {
            setTimeout(() => {
              if (i < maximoSenoras) {
                generarSenora();
              }
            }, Math.random() * 1000);
          }
        }

        function aumentarVelocidadSenoras() {
          // Obtener todas las señoras y ajustar la duración de la animación
          const senoras = document.querySelectorAll('.senora');
          senoras.forEach((senora) => {
            const estiloSenora = getComputedStyle(senora);
            const duracionActual = parseFloat(estiloSenora.animationDuration.replace('s', ''));
            const nuevaDuracion = duracionActual * 0.9; // Reducir la duración en un 10%
            senora.style.animationDuration = nuevaDuración + 's';
          });
        }

        function generarSenorasAleatorias() {
          // Generar un número aleatorio entre 1 y 5 para determinar cuántas señoras agregar
          const cantidadNuevaSenoras = Math.min(Math.floor(Math.random() * 5) + 1, maxSenoras - cantidadSenoras);

          // Generar señoras adicionales de forma aleatoria
          for (let i = 0; i < cantidadNuevaSenoras; i++) {
            generarSenora();
          }
        }

        function generarMonedaSuelo() {
          if (!juegoActivo || !generandoMoneda) return;

          const moneda = document.createElement('div');
          moneda.className = 'moneda-suelo';
          const randomLeft = Math.random() * (document.getElementById('juegoContainer').offsetWidth - 20);
          moneda.style.left = randomLeft + 'px';
          document.getElementById('juegoContainer').appendChild(moneda);

          // Solo permitir la generación de una moneda
          generandoMoneda = false;

          // Permitir la generación de una nueva moneda después de 4 segundos
          setTimeout(() => {
            if (juegoActivo) {
              document.getElementById('juegoContainer').removeChild(moneda);
              // Permitir la generación de una nueva moneda
              generandoMoneda = true;
            }
          }, 4000);
        }

        function reiniciarNivel() {

          puntuacion = 0;
          juegoActivo = true;
          generandoMoneda = true;
          cantidadSenoras = 1;
          document.getElementById('puntuacion').textContent = 'Puntuación: 0';
          const mensajePerdida = document.getElementById('mensaje-perdida');
          const mensajePausa = document.getElementById('mensaje-pausa');
          mensajePerdida.style.display = 'none';
          mensajePausa.style.display = 'none';
          //Mostrar bandera
          const badnera = document.getElementById('badnera');
          bandera.style.display = 'block';
          // Limpiar señoras y monedas existentes
          const contenedor = document.getElementById('juegoContainer');
          contenedor.querySelectorAll('.senora').forEach((senora) => senora.remove());
          contenedor.querySelectorAll('.moneda-suelo').forEach((moneda) => moneda.remove());

          // Mostrar el casco nuevamente
          const casco = document.getElementById('casco');
          casco.style.display = 'block';

          // Detener intervalos existentes antes de iniciar nuevos
          clearInterval(intervaloSenoras);
          clearInterval(intervaloMonedas);

          // Reiniciar el personaje
          reiniciarPersonaje();

          // Iniciar generación de señoras y monedas
          intervaloSenoras = setInterval(generarSenoras, 2000);
          intervaloMonedas = setInterval(generarMonedaSuelo, Math.floor(Math.random() * 4000) + 1000);
        }


        function pausarJuego() {
          // Pausar o reanudar juego al presionar la tecla P
          juegoActivo = !juegoActivo;

          // Mostrar u ocultar mensaje de pausa
          const mensajePausa = document.getElementById('mensaje-pausa');
          mensajePausa.style.display = juegoActivo ? 'none' : 'block';
        }

        // Iniciar intervalos al cargar la página
        intervaloSenoras = setInterval(generarSenoras, 2000);
        intervaloMonedas = setInterval(generarMonedaSuelo, Math.floor(Math.random() * 4000) + 1000);

        // Verificar colisión en intervalos regulares
        setInterval(verificarColision, 100);
      });
      document.addEventListener('keydown', function (event) {
        if (!juegoActivo) {
          if (event.key === 'r') {
            reiniciarNivel();
          }
          return;
        }

        const persona = document.getElementById('persona');
        const posicionPersona = persona.offsetLeft;

        if (event.key === 'ArrowLeft' || event.key === 'a') {
          if (posicionPersona > 0) {
            persona.style.left = posicionPersona - 10 + 'px';
            verificarColision();
            // Aplicar animación de caminar cuando se mueve a la izquierda
            persona.style.transform = 'translateX(-50%) scaleY(0.95)';
          }
        } else if (event.key === 'ArrowRight' || event.key === 'd') {
          if (posicionPersona + persona.offsetWidth < document.getElementById('juegoContainer').offsetWidth) {
            persona.style.left = posicionPersona + 10 + 'px';
            verificarColision();
            // Aplicar animación de caminar cuando se mueve a la derecha
            persona.style.transform = 'translateX(-50%) scaleY(0.95)';
          }
        } else if (event.key === 'p' || event.key === 'P') {
          pausarJuego();
        }
      });

      document.addEventListener('keyup', function (event) {
        if (!juegoActivo) return;

        const persona = document.getElementById('persona');

        // Detener la animación de caminar cuando se suelta la tecla de flecha izquierda o derecha
        if ((event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'ArrowRight' || event.key === 'd')) {
          persona.style.transform = 'translateX(-50%)';
        }
      });
      function reiniciarPersonaje() {
        const persona = document.getElementById('persona');
        persona.style.left = '50%'; // Restablecer la posición inicial del personaje
        persona.classList.remove('golpeado'); // Eliminar la clase 'golpeado'

        // Asegurar que la animación de salida volando se reinicie
        setTimeout(() => {
          persona.style.animation = 'none';
          persona.offsetHeight; /* trigger reflow */
          persona.style.animation = null;
        }, 50);
      }

    </script>
</body>
